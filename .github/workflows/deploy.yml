name: Build & Deploy

on:
  push:
    branches: [master]

env:
  REGISTRY: ghcr.io
  ORG: labsativai

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node --check server/index.js server/auth.js server/logger.js server/openaiClient.js server/extractText.js

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/ativawriter-panel:latest
            ${{ env.REGISTRY }}/${{ env.ORG }}/ativawriter-panel:${{ github.sha }}
      - name: Trigger Portainer
        run: |
          if [ -z "${{ secrets.PORTAINER_WEBHOOK_ATIVAWRITER }}" ]; then
            echo "::warning::PORTAINER_WEBHOOK_ATIVAWRITER não configurado — imagem publicada mas stack não foi redeployada automaticamente"
            exit 0
          fi
          curl -sf -X POST "${{ secrets.PORTAINER_WEBHOOK_ATIVAWRITER }}"
