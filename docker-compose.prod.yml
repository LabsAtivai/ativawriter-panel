services:
  ativawriter-panel:
    image: ghcr.io/labsativai/ativawriter-panel:latest
    container_name: ativawriter-panel
    restart: unless-stopped
    environment:
      APP_PASSWORD: ${APP_PASSWORD}
      COOKIE_SECRET: ${COOKIE_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      PORT: 3300
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3300/api/session').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 640M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - ativaai

networks:
  ativaai:
    external: true
